<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chris TWT Message</title>
<style>
  :root {
    --page: #e5e5ea;
    --screen: #ffffff;
    --text: #000000;
    --muted: #8e8e93;
    --bubble-in: #e9e9eb;
    --blue: #007aff;
    --bar: rgba(249,249,249,0.94);
    --hair: #d1d1d6;
    --avatar-a: #a5abb8;
    --avatar-b: #868c99;
    --frame: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #101012; --screen: #000; --text: #fff; --muted: #8e8e93;
      --bubble-in: #26252a; --blue: #0a84ff; --bar: rgba(22,22,24,0.94);
      --hair: #38383a; --frame: #3a3a3c;
    }
  }
  :root[data-theme="dark"] {
    --page: #101012; --screen: #000; --text: #fff; --muted: #8e8e93;
    --bubble-in: #26252a; --blue: #0a84ff; --bar: rgba(22,22,24,0.94);
    --hair: #38383a; --frame: #3a3a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .phone {
    width: 100%; max-width: 390px; aspect-ratio: 390 / 844;
    background: var(--screen);
    border: 12px solid var(--frame);
    border-radius: 56px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; background: #000; border-radius: 20px; z-index: 3;
  }
  .status {
    height: 54px; padding: 0 30px 0 38px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 16px; background: var(--bar);
  }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status svg { fill: var(--text); }
  .header {
    background: var(--bar);
    border-bottom: 0.5px solid var(--hair);
    padding: 2px 12px 10px;
    display: grid; grid-template-columns: 60px 1fr 60px; align-items: start;
  }
  .back { color: var(--blue); display: flex; align-items: center; gap: 2px; padding-top: 14px; font-size: 17px; }
  .back svg { stroke: var(--blue); }
  .badge { background: var(--blue); color: #fff; font-size: 13px; border-radius: 10px; padding: 1px 7px; }
  .contact { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .avatar {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(180deg, var(--avatar-a), var(--avatar-b));
    color: #fff; font-weight: 600; font-size: 21px;
    display: flex; align-items: center; justify-content: center;
  }
  .name { font-size: 12px; display: flex; align-items: center; gap: 2px; }
  .name span { color: var(--muted); font-size: 10px; }
  .video { justify-self: end; padding-top: 18px; }
  .video svg { fill: var(--blue); }
  .thread { flex: 1; padding: 14px 12px; overflow-y: auto; }
  .stamp { text-align: center; color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .stamp b { font-weight: 600; }
  .bubble {
    background: var(--bubble-in);
    padding: 7px 13px; font-size: 17px; line-height: 1.3;
    border-radius: 18px; max-width: 75%; width: fit-content;
    position: relative; margin-left: 4px;
  }
  .bubble::before {
    content: ""; position: absolute; bottom: 0; left: -7px;
    width: 20px; height: 18px; background: var(--bubble-in);
    border-bottom-right-radius: 16px 14px;
  }
  .bubble::after {
    content: ""; position: absolute; bottom: 0; left: -10px;
    width: 10px; height: 18px; background: var(--screen);
    border-bottom-right-radius: 10px;
  }
  .composer {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 34px; background: var(--screen);
  }
  .plus {
    width: 34px; height: 34px; border-radius: 50%; background: var(--bubble-in);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; flex-shrink: 0;
  }
  .field {
    flex: 1; border: 1px solid var(--hair); border-radius: 18px;
    padding: 7px 14px; color: var(--muted); font-size: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .field svg { fill: var(--muted); }
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>

    <div class="status">
      <span>9:41</span>
      <div class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .7 10.4 10.4 0 0 0 .8 3.6L2 4.9a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 4.1 7 7 0 0 0 3.2 6l1.2 1.3c1-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8 11.3 6.7 9.8c.3-.3.8-.5 1.3-.5z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="24.5" y="4" width="2" height="5" rx="1" opacity=".4"/></svg>
      </div>
    </div>

    <div class="header">
      <div class="back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
        <span class="badge">1</span>
      </div>
      <div class="contact">
        <div class="avatar">CT</div>
        <div class="name">Chris TWT <span>&#x203A;</span></div>
      </div>
      <div class="video">
        <svg width="26" height="18" viewBox="0 0 26 18"><rect x="0" y="1" width="18" height="16" rx="4"/><path d="M19 7l6-4v12l-6-4z"/></svg>
      </div>
    </div>

    <div class="thread">
      <div class="stamp"><b>Text Message</b><br>Today 8:12 AM</div>
      <div class="bubble">Come into work today</div>
    </div>

    <div class="composer">
      <div class="plus">+</div>
      <div class="field">
        <span>Text Message</span>
        <svg width="14" height="20" viewBox="0 0 14 20"><rect x="4" y="0" width="6" height="12" rx="3"/><path d="M1 9a6 6 0 0 0 12 0h-1.6a4.4 4.4 0 0 1-8.8 0zM6.2 15h1.6v4H6.2z"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
